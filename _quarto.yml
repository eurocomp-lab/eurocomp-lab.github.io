# EU-register variant. To switch back to the warm theme:
#   change theme-eu.scss to theme.scss in the format block below.

project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!XX-*.qmd"        # parked drafts: prefix a file XX- to keep it out of the site

website:
  title: "EuroCOMP Lab"
  description: "Experimentation for evidence-based policymaking and adaptive learning in cohesion policy"
  favicon: assets/logo/favicon.png

  navbar:
    background: primary
    pinned: true        # the menu stays visible while scrolling (REGIO feedback, 27 October)
    # White version of the logo for the blue bar; the original file is
    # assets/logo/eurocomp-lab-logo.svg (for light backgrounds).
    logo: assets/logo/eurocomp-lab-logo-white.svg
    logo-alt: "European Regional Competitiveness Policy Lab (EuroCOMP Lab), home page"
    title: false
    left:
      - href: 01-why-and-when.qmd
        text: "RCTs: why and when"
      # Dropdowns show one level of pages. Deeper pages (the step detail
      # pages, the repository topics) are linked from their parent page.
      - text: "How to design an RCT"
        menu:
          - href: 02-how.qmd
            text: Overview
          - text: "---"
          - href: 02.01-toc.qmd
          - href: 02.02-eval_questions.qmd
          - href: 02.03-indicators.qmd
          - href: 02.04-assess.qmd
          - href: 02.05-randomisation.qmd
          - href: 02.06-data_sources.qmd
          - href: 02.07-data_collect.qmd
          - href: 02.08-data_quality.qmd
      - href: 03-examples.qmd
        text: Examples
      - text: Repository
        menu:
          - href: 09-bank_outcomes.qmd
          - href: 08-bank_survey.qmd
      - text: About
        menu:
          - href: eurocomp.qmd
            text: EuroCOMP Lab
          - href: research-partners.qmd
            text: Research partners
          - href: glossary.qmd
            text: Glossary

  page-footer:
    border: true
    left: "EuroCOMP Lab, powered by the World Bank Group"
    right: "Draft site, under review by the team"

format:
  html:
    theme: [cosmo, theme-eu.scss, theme-eu-refresh.scss]
    toc: true
    toc-title: "On this page"
    toc-depth: 3
    anchor-sections: true
    link-external-newwindow: false
    date-format: "D MMMM YYYY"
    # highlights the current section in the top bar (there is no left menu)
    include-after-body:
      - _nav-current.html
      # group labels in the On this page menu (examples page, why-and-when page)
      - _toc-groups.html
      # with the menu pinned, a page opened at a #section scrolls its heading out from under it
      - _anchor-offset.html
