# EU-register variant. To switch back to the warm theme:
#   change theme-eu.scss to theme.scss in the format block below.

project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!XX-*.qmd"        # parked drafts: prefix a file XX- to keep it out of the site

